<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-10">
    <div class="max-w-6xl mx-auto bg-white p-8 rounded-xl shadow-xl border-t-4 border-green-600">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-serif text-gray-800">Dashboard Admin: Daftar User & API Key</h1>
            <a href="index.html" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 text-sm">Logout</a>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full border-collapse">
                <thead>
                    <tr class="bg-gray-100 text-left text-gray-600 uppercase text-sm leading-normal">
                        <th class="py-3 px-6">ID User</th>
                        <th class="py-3 px-6">Nama Depan</th>
                        <th class="py-3 px-6">Nama Belakang</th>
                        <th class="py-3 px-6">Email</th>
                        <th class="py-3 px-6">API Key</th>
                        <th class="py-3 px-6">Status Key</th>
                        <th class="py-3 px-6">Aksi</th>
                    </tr>
                </thead>
                <tbody class="text-gray-600 text-sm font-light" id="tableBody">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadData() {
            const res = await fetch('http://localhost:3000/users');
            const users = await res.json();
            const tableBody = document.getElementById('tableBody');

            tableBody.innerHTML = users.map(user => `
                <tr class="border-b border-gray-200 hover:bg-gray-50">
                    <td class="py-3 px-6 text-left whitespace-nowrap">${user.id}</td>
                    <td class="py-3 px-6 text-left">${user.firstName}</td>
                    <td class="py-3 px-6 text-left">${user.lastName}</td>
                    <td class="py-3 px-6 text-left">${user.email}</td>
                    <td class="py-3 px-6 text-left font-mono text-xs bg-gray-100 p-1 rounded">${user.api_key}</td>
                    <td class="py-3 px-6 text-center">
                        <span class="bg-green-200 text-green-600 py-1 px-3 rounded-full text-xs">${user.status}</span>
                    </td>
                    <td class="py-3 px-6 text-center">
                        <button class="text-red-500 hover:text-red-700">Hapus</button>
                    </td>
                </tr>
            `).join('');
        }
        loadData();
    </script>
</body>
</html>
