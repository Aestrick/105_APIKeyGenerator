<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border-t-4 border-green-600">
        <h2 class="text-2xl font-bold mb-6 text-gray-800">Admin Login</h2>
        
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-gray-600 mb-1">Email:</label>
                <input type="email" id="email" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-green-500 outline-none">
            </div>
            <div>
                <label class="block text-gray-600 mb-1">Password:</label>
                <input type="password" id="password" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-green-500 outline-none">
            </div>
            
            <button type="submit" class="w-full bg-gray-200 text-gray-700 font-bold py-2 rounded hover:bg-gray-300 transition">
                Login
            </button>
        </form>
        
        <p class="mt-4 text-sm text-gray-500">
            Belum punya akun? <a href="index.html" class="text-blue-500 hover:underline">Register di sini</a>
        </p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const res = await fetch('http://localhost:3000/admin-login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const result = await res.json();
            if (result.success) {
                window.location.href = 'dashboard.html';
            } else {
                alert('Email atau Password Salah! (Hint: admin@admin.com / admin)');
            }
        });
    </script>
</body>
</html>
