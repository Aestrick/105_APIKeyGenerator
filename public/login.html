<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border-t-4 border-green-600">
        <h2 class="text-2xl font-bold mb-6 text-gray-800">Admin Login</h2>
        
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-gray-600 mb-1">Email:</label>
                <input type="email" id="email" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-green-500 outline-none" placeholder="admin@admin.com" required>
            </div>
            <div>
                <label class="block text-gray-600 mb-1">Password:</label>
                <input type="password" id="password" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-green-500 outline-none" required>
            </div>
            
            <button type="submit" class="w-full bg-gray-800 text-white font-bold py-2 rounded hover:bg-gray-900 transition">
                Login Masuk
            </button>
        </form>
        
        <p class="mt-4 text-sm text-gray-500 text-center">
            Kembali ke <a href="index.html" class="text-green-600 hover:underline">Halaman Utama</a>
        </p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('loginForm');

            // Cek dulu form-nya ada apa nggak biar gak error null
            if (loginForm) {
                loginForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    const emailInput = document.getElementById('email');
                    const passwordInput = document.getElementById('password');
                    
                    if (!emailInput || !passwordInput) return;

                    const email = emailInput.value;
                    const password = passwordInput.value;

                    console.log("Mencoba login...");

                    try {
                        // Pastikan port server lo bener (biasanya 3000)
                        const res = await fetch('http://localhost:3000/admin-login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email, password })
                        });

                        const result = await res.json();

                        if (result.success) {
                            alert("Login Berhasil! Klik OK untuk masuk ke Dashboard.");
                            window.location.href = 'dashboard.html';
                        } else {
                            alert(result.message || 'Email atau Password Salah!');
                        }
                    } catch (error) {
                        console.error("Error Fetch:", error);
                        alert("Gagal menghubungi server. Pastikan 'npm start' sudah jalan di port 3000!");
                    }
                });
            } else {
                console.error("Error: Element dengan ID 'loginForm' tidak ditemukan!");
            }
        });
    </script>
</body>
</html>
