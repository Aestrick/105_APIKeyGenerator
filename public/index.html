<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate API Key</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-2xl border-t-4 border-green-500">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Daftar User & Generate API Key</h1>
            <a href="login.html" class="text-sm text-blue-500 hover:underline">Admin Login →</a>
        </div>

        <form id="registerForm" class="space-y-4">
            <div class="grid grid-cols-3 items-center gap-4">
                <label class="text-gray-600 font-medium">Nama Depan:</label>
                <input type="text" id="firstName" class="col-span-2 w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-green-400 outline-none" placeholder="Masukkan Nama Depan">
            </div>

            <div class="grid grid-cols-3 items-center gap-4">
                <label class="text-gray-600 font-medium">Nama Belakang:</label>
                <input type="text" id="lastName" class="col-span-2 w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-green-400 outline-none" placeholder="Masukkan Nama Belakang">
            </div>

            <div class="grid grid-cols-3 items-center gap-4">
                <label class="text-gray-600 font-medium">Email:</label>
                <input type="email" id="email" class="col-span-2 w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-green-400 outline-none" placeholder="email@contoh.com">
            </div>

            <div class="grid grid-cols-3 items-center gap-4">
                <label class="text-gray-600 font-medium">API Key Anda:</label>
                <input type="text" id="apiKey" readonly class="col-span-2 w-full p-2 bg-gray-100 border border-gray-300 rounded text-gray-500 italic" placeholder="Klik Generate untuk mendapatkan key">
            </div>

            <div class="grid grid-cols-3 gap-4">
                <div></div>
                <button type="button" onclick="generateKey()" class="col-span-2 w-1/3 bg-white border border-gray-300 text-gray-700 py-1 px-4 rounded hover:bg-gray-50 text-sm shadow-sm transition">
                    Generate Key
                </button>
            </div>

            <hr class="my-4">

            <button type="submit" class="bg-gray-200 text-gray-400 font-bold py-2 px-4 rounded cursor-not-allowed w-full transition duration-300" id="btnSimpan" disabled>
                Simpan Data User dan API Key
            </button>
        </form>
    </div>

    <script>
        // Fungsi Generate Key Random di Frontend (Sesuai flow gambar)
        function generateKey() {
            const randomKey = [...Array(30)].map(() => Math.random().toString(36)[2]).join('');
            const apiKeyInput = document.getElementById('apiKey');
            apiKeyInput.value = randomKey;
            apiKeyInput.classList.remove('bg-gray-100', 'text-gray-500', 'italic');
            apiKeyInput.classList.add('bg-white', 'text-gray-800', 'font-mono');
            
            // Aktifkan tombol simpan
            const btn = document.getElementById('btnSimpan');
            btn.disabled = false;
            btn.classList.remove('bg-gray-200', 'text-gray-400', 'cursor-not-allowed');
            btn.classList.add('bg-green-600', 'text-white', 'hover:bg-green-700');
        }

        // Kirim Data ke Backend
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                api_key: document.getElementById('apiKey').value
            };

            const res = await fetch('http://localhost:3000/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await res.json();
            if (result.success) {
                alert('User & API Key Berhasil Disimpan!');
                window.location.reload();
            } else {
                alert('Gagal menyimpan data.');
            }
        });
    </script>
</body>
</html>
